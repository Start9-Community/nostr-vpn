name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Run focused verification
        env:
          NVPN_VERIFY_FAST_WORKSPACE: '1'
        run: ./scripts/verify.sh fast

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check web sources
        run: npm ci && npm run check

  macos-sdk-compat:
    name: Xcode 15 macOS compatibility
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Type-check scanner with Xcode 15.4
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/check-macos-swift-sdk-compat.sh
